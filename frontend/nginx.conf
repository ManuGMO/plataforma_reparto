server {
    server_name mercadolocal.inf.uach.cl;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/mercadolocal.inf.uach.cl/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/mercadolocal.inf.uach.cl/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

server {
    if ($host = mercadolocal.inf.uach.cl) {
        return 301 https://$host$request_uri;
    } 

    listen 80;
    server_name mercadolocal.inf.uach.cl;
    return 404; 
}